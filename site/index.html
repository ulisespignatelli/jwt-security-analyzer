<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>JWT Security Analyzer</title>
<meta name="description" content="Analizador de seguridad de JSON Web Tokens: decodifica y audita configuraciones inseguras (alg none, confusión de algoritmos, secretos débiles, datos sensibles). Todo en el navegador.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237c5cff'/><path d='M16 6v20M16 6l-7 5M16 6l7 5M9 16h14' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#7c5cff"/><path d="M16 6v20M16 6l-7 5M16 6l7 5M9 16h14" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
    <span>JWT <b>Security</b> Analyzer</span>
  </div>
  <div class="actions">
    <select class="btn" id="lang" title="Idioma / Language"><option value="es">🇦🇷 ES</option><option value="en">🇬🇧 EN</option></select>
    <a class="btn ghost" id="aboutLink" href="#about">?</a>
  </div>
</header>
<main>
  <section class="intro" id="intro"></section>
  <div class="cols">
    <div class="left">
      <div class="card">
        <div class="card-h"><h2 id="inputTitle"></h2><div class="ex-btns" id="exBtns"></div></div>
        <textarea id="input" class="token-in" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        <div id="inputErr" class="err" hidden></div>
      </div>
      <div id="scoreCard"></div>
      <div id="secretCard"></div>
    </div>
    <div class="right" id="output"></div>
  </div>
  <section class="about" id="about"></section>
</main>
<footer class="foot" id="foot"></footer>
<script src="js/jwt.js"></script>
<script src="js/wordlist.js"></script>
<script src="js/app.js"></script>
</body>
</html>
